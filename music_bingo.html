<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster Music Bingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            /* Força la barra de desplaçament vertical per evitar salts de disseny */
            overflow-y: scroll;
            /* CORRECCIÓ CLAU: Força l'ocultació de qualsevol desbordament horitzontal */
            overflow-x: hidden !important; 
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* gray-900 per defecte */
            /* Centratge vertical i horitzontal de la CARD amb Flexbox */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Permet que el contingut llarg es desplaci */
            min-height: 100vh;
            padding: 2rem 1rem; /* Padding a banda i banda per a marges en mòbil */
            transition: background-color 0.2s ease; /* Transició més ràpida per l'efecte disco */
        }
        
        /* APLICACIÓ DE CENTRATGE I AMPLADA MAXIMAL AL CONTENIDOR PRINCIPAL */
        #main-card {
            width: 100%; /* Ocupa tota l'amplada disponible del contenidor flex (body) */
            max-width: 1024px; /* max-w-4xl - Límit elegant per a la visualització vertical en escriptori */
            margin: 0 auto; /* Centratge addicional per seguretat */
            transition: background-color 0.2s ease;
            /* Afegit per focus */
            outline: none;
        }

        /* ========================================================== */
        /* NOU ESTIL: Mode Horitzontal (Responsive) o Simulat         */
        /* ========================================================== */
        
        .landscape-mode {
            /* En mode landscape, permetem que s'expandeixi més per aprofitar l'espai */
            max-width: 1280px !important; /* max-w-7xl, utilitza més espai que abans */
            
            /* Grid de dues columnes */
            display: grid;
            /* Definim columnes: 1a columna per al reproductor (ample fix/màx 400px), 2a per a la informació (flex) */
            grid-template-columns: minmax(350px, 400px) 1fr; 
            gap: 3rem; /* Espai més gran entre columnes */
        }
        
        /* Ajustos per al layout de columnes */
        .landscape-mode #game-content-container {
            grid-column: 1 / -1; 
            display: contents; 
        }
        
        .landscape-mode #game-controls {
            grid-column: 1 / 2;
            /* Eliminem el centratge automàtic en mode landscape */
            margin-left: 0 !important;
            margin-right: 0 !important;
        }
        
        .landscape-mode #info-and-setup {
            grid-column: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .landscape-mode #info-spacer {
            border-top: none !important; 
            margin-top: 0 !important;
            padding-top: 0 !important;
        }
        
        /* Ajust per a la màscara: Assegura que l'alçada sigui 100% de la del reproductor */
        #player-mask {
            height: 100%; 
        }

        /* ========================================================== */
        /* ESTILS PER LA RULETA BINGO                                 */
        /* ========================================================== */
        .roulette-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            /* Assegura que el comptador absolut es posicioni respecte a això */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Els 5 colors: Verd, Rosa, Groc, Violeta, Blau Cel */
            background: conic-gradient(
                #4ade80 0% 20%,   /* Verd - 1 */
                #f472b6 20% 40%,  /* Rosa - 2 */
                #facc15 40% 60%,  /* Groc - 3 */
                #a78bfa 60% 80%,  /* Violeta - 4 */
                #22d3ee 80% 100%  /* Blau - 5 */
            );
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1); /* Efecte de desacceleració */
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border: 4px solid #374151; /* Border gris fosc */
        }

        .roulette-arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid white; /* Fletxa blanca apuntant avall */
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        .roulette-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background-color: #374151;
            border-radius: 50%;
            z-index: 5;
        }
        
        /* Estil per al comptador superposat */
        #countdown-display {
            position: absolute;
            z-index: 20; /* Per sobre de la ruleta i la fletxa */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-variant-numeric: tabular-nums;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); /* Ombra forta per contrast */
            pointer-events: none; /* Permet veure el centre de sota si calgués */
        }

        /* ========================================================== */
        /* ANIMACIÓ RAINBOW PER AL BOTÓ NOU HIT                       */
        /* ========================================================== */
        @keyframes rainbow-button {
            0% { background-color: #4ade80; } /* Green */
            20% { background-color: #f472b6; } /* Pink */
            40% { background-color: #facc15; } /* Yellow */
            60% { background-color: #a78bfa; } /* Violet */
            80% { background-color: #22d3ee; } /* Blue */
            100% { background-color: #4ade80; } /* Green */
        }
        
        .btn-rainbow-active {
            animation: rainbow-button 4s linear infinite !important;
            color: #111827 !important; /* Text fosc per contrast */
            font-weight: 800;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
        }

    </style>
</head>

        // --- Referències a elements del DOM ---

        const toggleOrientationBtn = document.getElementById('toggle-orientation-btn');

        // --- Constants per a la càrrega remota ---
        const REMOTE_CONTENT_BASE_URL = 'https://raw.githubusercontent.com/xaviuab/Hitster_Digital/main/dades/';
        const GITHUB_API_URL = "https://api.github.com/repos/xaviuab/Hitster_Digital/contents/dades";
        
        // --- Configuració del Bingo (CARA A - Novell) ---
        const bingoTasksNovell = [
            { label: "Grup o solista", color: "#4ade80", textColorClass: "text-green-400" },      // Verd
            { label: "Anterior al 2000?", color: "#f472b6", textColorClass: "text-pink-400" },    // Rosa
            { label: "4 anys amunt o avall", color: "#facc15", textColorClass: "text-yellow-400" }, // Groc
            { label: "Dècada", color: "#a78bfa", textColorClass: "text-violet-400" },             // Violeta
            { label: "2 anys amunt o avall", color: "#22d3ee", textColorClass: "text-cyan-400" }    // Blau
        ];

        // --- Configuració del Bingo (CARA B - Expert) ---
        const bingoTasksExpert = [
            { label: "Títol de la cançó", color: "#4ade80", textColorClass: "text-green-400" },     // Verd
            { label: "Any exacte", color: "#f472b6", textColorClass: "text-pink-400" },             // Rosa
            { label: "Nom del grup o solista", color: "#facc15", textColorClass: "text-yellow-400" }, // Groc
            { label: "Dècada", color: "#a78bfa", textColorClass: "text-violet-400" },               // Violeta
            { label: "3 anys amunt o avall", color: "#22d3ee", textColorClass: "text-cyan-400" }    // Blau
        ];
        
        // --- Estat de l'aplicació ---
        let errorTimeout;
        let allTracksFromFile = [];
        let loadedFileMetadata = []; 
        let availableTracks = [];
        let currentTrack;
        let categoriesLocked = false;
        let selectedCategoriesOnLoad = [];
        let totalTracksCountByCategory = {}; 
        let spotifyAccountType = null; 
        let isSimulatedLandscape = false;
        let currentBingoResult = null; 
        let currentLevel = 'novell'; 
        let sessionHistory = []; // Array per guardar l'historial
        
        // --- Variables per al compte enrere i control ---
        let countdownInterval = null;
        let rapidColorInterval = null;
        let iframeFocusInterval = null; 
        let hasWheelSpun = false; 
        const DEFAULT_BODY_BG = '#111827'; 
        const DEFAULT_CARD_BG = '#1f2937'; 
        // MODIFICAT: Player bg per defecte a gray-800 (#1f2937)
        const DEFAULT_PLAYER_BG = '#1f2937'; 
        
        // Detecció de dispositiu mòbil (aproximada)
        // isMobile general (inclou Android i iOS)
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        // isIOS específic (només dispositius Apple)
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        // --- AUDIO CONTEXT ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep(duration, frequency, type = 'square') {
            try {
                initAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                // Volum constant (0.3 per defecte)
                const peakVolume = 0.3;

                gainNode.gain.setValueAtTime(peakVolume, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.warn("Audio error:", e);
            }
        }

        // So de "clic" de la ruleta
        function playRouletteClick() {
            try {
                initAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                // So curt i percussiu
                oscillator.type = 'square'; 
                // Baixada ràpida de to per fer "clac"
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                // VOLUM AUGMENTAT A 0.4
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);

                // Animació de la fletxa (NOMÉS IMPULS, SENSE RETORN SUAU)
                const arrow = document.querySelector('.roulette-arrow');
                if (arrow) {
                    arrow.animate([
                        { transform: 'translateX(-50%) rotate(0deg)' },
                        { transform: 'translateX(-50%) rotate(-25deg)' } // Moviment més pronunciat
                    ], {
                        duration: 60, // Molt ràpid
                        easing: 'ease-out',
                        fill: 'none' 
                    });
                }

            } catch (e) {
                // Ignorar
            }
        }

        // Programa els clics de la ruleta
        function scheduleRouletteSounds() {
            let time = 0;
            let delay = 50; 
            
            function nextClick() {
                // MODIFICAT: Aturar abans dels 3000ms per evitar moviment final
                if (time >= 2500) return; 
                
                setTimeout(() => {
                    playRouletteClick();
                    nextClick();
                }, delay);
                
                time += delay;
                delay *= 1.15; // Desacceleració exponencial
            }
            nextClick();
        }

        function getCleanCategoryName(filename) {
            let baseName = filename.split('.').slice(0, -1).join('.');
            while (baseName.startsWith('.') || baseName.startsWith('_')) {
                baseName = baseName.substring(1); 
            }
            return baseName || filename;
        }

        function parseCsvContent(fileContent, categoryName) {
            const tracks = [];
            const lines = fileContent.trim().split('\n');
            if (lines.length <= 1) return tracks;

            const delimiter = ';'; 
            const startLine = (lines[0].split(delimiter).length >= 4 && lines[0].toLowerCase().includes('spotify')) ? 1 : 0;

            for (let i = startLine; i < lines.length; i++) { 
                const line = lines[i].trim();
                if (!line) continue; 

                const parts = line.split(delimiter);
                const cleanedParts = parts.map(part => part.trim().replace(/^"|"$/g, ''));

                if (cleanedParts.length >= 4) {
                    const uri = cleanedParts[0]; 	
                    const title = cleanedParts[1]; 	
                    const artist = cleanedParts[2]; 	
                    const yearData = cleanedParts[3]; 
                    const yearMatch = yearData.match(/\d{4}/);
                    const year = yearMatch ? yearMatch[0] : 'N/A';
                    const finalCategory = categoryName;
                    
                    // NOU: Extreure columna 5 si existeix
                    let extraInfo = "";
                    if (cleanedParts.length >= 5) {
                        extraInfo = cleanedParts[4];
                    }

                    if (uri && title && finalCategory) {
                        tracks.push({ 
                            uri, 
                            title, 
                            artist, 
                            year, 
                            category: finalCategory,
                            extraInfo: extraInfo 
                        });
                    }
                }
            }
            return tracks;
        }

        // Helper per calcular dècada (1981-1990 = 80s)
        function calculateDecadeText(year) {
            const y = parseInt(year);
            if (isNaN(y)) return "";
            // Formula: (Any - 1) / 10 -> part entera -> * 10.
            // 1990 -> 1989 -> 198 -> 1980.
            // 1991 -> 1990 -> 199 -> 1990.
            const decadeStart = Math.floor((y - 1) / 10) * 10;
            
            if (decadeStart < 2000) {
                return `els ${decadeStart % 100}`; // "els 80", "els 90"
            } else {
                return `${decadeStart}`; // "2000", "2010"
            }
        }

        function calculateRangeText(yearStr, rangeText) {
             const year = parseInt(yearStr);
             if (isNaN(year)) return "";
             
             // Extreure número de la cadena "4 anys...", "2 anys..."
             const match = rangeText.match(/(\d+)/);
             if (!match) return "";
             const diff = parseInt(match[0]);
             
             const start = year - diff;
             const end = year + diff;
             
             let yearsList = [];
             for (let i = start; i <= end; i++) {
                 yearsList.push(i);
             }
             return yearsList.join(", ");
        }

        function showInitialPlayerMessage() {
            let message = '';
            if (!spotifyAccountType) {
                message = `✨ Tria el tipus de compte Spotify 🎤`;
            } else {

        function hideDynamicContent() {

        function showButtonError(message) {

        async function processFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const fileContent = event.target.result;
                    const categoryName = getCleanCategoryName(file.name);
                    const tracks = parseCsvContent(fileContent, categoryName);
                    resolve({tracks, categoryName, isPriority: file.name.startsWith('_')});
                };
                reader.onerror = (error) => reject(error);
                reader.readAsText(file);
            });
        }

        async function handleFileUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            uploadButton.disabled = true;
            uploadButton.textContent = 'Processant...';
            
            selectedCategoriesOnLoad = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(input => input.value);

            for (const file of files) {
                if (loadedFileMetadata.some(meta => meta.originalName === file.name)) continue; 
                try {
                    const { tracks: newTracks, categoryName, isPriority } = await processFile(file);
                    
                    allTracksFromFile.push(...newTracks);
                    loadedFileMetadata.push({ 
                        originalName: file.name, 
                        cleanName: categoryName,
                        isPriority: isPriority 
                    });
                    
                    totalTracksCountByCategory[categoryName] = (totalTracksCountByCategory[categoryName] || 0) + newTracks.length;
                    
                    if (!selectedCategoriesOnLoad.includes(categoryName)) {
                        selectedCategoriesOnLoad.push(categoryName);
                    }
                } catch (error) {
                    console.error("Error llegint el fitxer:", error);
                }
            }
            
            fileList.innerHTML = ''; 
            if (allTracksFromFile.length > 0) {
                renderSetupSection(); 
            }

            uploadButton.disabled = false;
            uploadButton.textContent = 'Pujar Fitxer(s) CSV/TXT';
            fileInput.value = ''; 
        }
        
        async function fetchRemoteCsvs() {
            const baseElement = document.getElementById('file-list');
            baseElement.innerHTML = `<span class="text-blue-400">🔍 Buscant categories remotes a la carpeta 'dades' (API GitHub)...</span>`;
            
            let remoteFilesToLoad = [];
            let successfullyLoadedCount = 0;

            try {
                const apiResponse = await fetch(GITHUB_API_URL);
                if (!apiResponse.ok) {
                    console.error(`Error de l'API de GitHub: ${apiResponse.statusText}. Es continua sense la càrrega dinàmica.`);
                } else {
                    const contents = await apiResponse.json();
                    if (Array.isArray(contents)) {
                        const allCsvFiles = contents
                            .filter(item => 
                                item.type === 'file' && 
                                item.name.toLowerCase().endsWith('.csv') && 
                                !item.name.startsWith('.') && 
                                !loadedFileMetadata.some(meta => meta.originalName === item.name)
                            )
                            .map(item => item.name);
                        
                        const underscoreFiles = allCsvFiles.filter(name => name.startsWith('_'));
                        const otherFiles = allCsvFiles.filter(name => !name.startsWith('_'));
                        remoteFilesToLoad = underscoreFiles.concat(otherFiles);
                    }
                }
            } catch (error) {
                console.warn("No s'ha pogut connectar a l'API de GitHub. Utilitzant només llistes internes i locals.", error);
            }
            
            const fetchPromises = remoteFilesToLoad.map(async (filename) => {
                const encodedFilename = encodeURIComponent(filename); 
                const url = `${REMOTE_CONTENT_BASE_URL}${encodedFilename}`; 
                
                const categoryName = getCleanCategoryName(filename); 
                const isPriority = filename.startsWith('_'); 

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`Error HTTP`);
                    const fileContent = await response.text();
                    const newTracks = parseCsvContent(fileContent, categoryName);
                    if (newTracks.length > 0) {
                        allTracksFromFile.push(...newTracks);
                        loadedFileMetadata.push({ 
                            originalName: filename, 
                            cleanName: categoryName,
                            isPriority: isPriority 
                        }); 
                        totalTracksCountByCategory[categoryName] = newTracks.length;
                        if (!selectedCategoriesOnLoad.includes(categoryName)) {
                            selectedCategoriesOnLoad.push(categoryName);
                        }
                        successfullyLoadedCount++;
                    }
                } catch (error) {
                    console.error(`Error processant ${filename}:`, error);
                }
            });

            await Promise.all(fetchPromises);
            
            if (successfullyLoadedCount > 0) {
                baseElement.innerHTML = ''; 
            } else if (remoteFilesToLoad.length > 0) {
                baseElement.innerHTML = `<span class="text-yellow-400">⚠️ Les categories remotes s'han detectat, però hi ha hagut un error en la càrrega o estan buides.</span>`;
            } else {
                baseElement.innerHTML = `<span class="text-gray-400">No s'han trobat fitxers CSV addicionals a la carpeta 'dades' del repositori.</span>`;
            }
        }

        function updateCategoryStyle(labelElement) {
            const checkbox = labelElement.querySelector('input[type="checkbox"]');
            const span = labelElement.querySelector('span');
            const isPriority = labelElement.dataset.priority === 'true';
            const selectedClasses = 'bg-green-500 text-gray-900 hover:bg-green-600 shadow-md'; 
            const defaultClasses = isPriority
                ? 'bg-gray-600 text-white hover:bg-gray-500' 
                : 'bg-gray-700/50 text-white hover:bg-gray-700';

            labelElement.classList.remove('bg-green-500', 'hover:bg-green-600', 'bg-blue-500', 'hover:bg-blue-600', 'bg-gray-700/50', 'bg-gray-600', 'text-gray-900', 'shadow-md', 'border', 'border-transparent');
            checkbox.classList.remove('text-green-500', 'text-blue-400', 'text-gray-900');

            if (checkbox.checked) {
                labelElement.classList.add(...selectedClasses.split(' '));
                span.classList.add('font-bold'); 
                checkbox.classList.add('text-gray-900'); 
            } else {
                labelElement.classList.add(...defaultClasses.split(' '));
                span.classList.remove('font-bold'); 
                
                if (isPriority) {

                } else {

                }
            }
        }

            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = null; rapidColorInterval = null; iframeFocusInterval = null;

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            if (rapidColorInterval) clearInterval(rapidColorInterval);
            initAudio();
            let timeLeft = 25;
            const countdownDisplay = document.getElementById('countdown-display');
            if (countdownDisplay) countdownDisplay.textContent = timeLeft;

            countdownInterval = setInterval(() => {
                timeLeft--;
                if (countdownDisplay) countdownDisplay.textContent = timeLeft;
                if (timeLeft <= 5 && timeLeft > 0) {
                    playBeep(0.2, 880, 'square'); 
                    if (!rapidColorInterval) {
                        let colorIndex = 0;
                        const discoColors = ['#facc15', '#4ade80', '#22d3ee', '#a78bfa', '#f472b6']; 
                        rapidColorInterval = setInterval(() => { setGlobalColor(discoColors[colorIndex]); colorIndex = (colorIndex + 1) % discoColors.length; }, 200);
                    }
                } else if (timeLeft === 0) {
                    playBeep(1.0, 440, 'square'); 
                    stopMusic(); 
                    if (countdownInterval) clearInterval(countdownInterval);
                    if (rapidColorInterval) clearInterval(rapidColorInterval);
                    if (iframeFocusInterval) clearInterval(iframeFocusInterval);
                    countdownInterval = null; rapidColorInterval = null; iframeFocusInterval = null;
                    if (currentBingoResult) setGlobalColor(currentBingoResult.color);
                }
            }, 1000);
        }

                        countdownDisplay.style.textShadow = "0 0 10px rgba(0,0,0,0.9)";
                    }
                    setGlobalColor(currentBingoResult.color);
                    mostrarInfoButton.classList.remove('hidden');
                    if (mainCard) mainCard.focus();
                    startCountdown();
                }, 3000); 
            }, 100);
        }

        function handleNouHitClick() {
            if (nouHitButton.disabled) return;
            initAudio(); 
            setGlobalColor(DEFAULT_BODY_BG);
            if (!categoriesLocked) {
                selectedCategoriesOnLoad = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(input => input.value);
                if (selectedCategoriesOnLoad.length === 0) { showButtonError('Selecciona una categoria'); return; }
                if (!spotifyAccountType) { showButtonError('Tria el tipus de compte Spotify'); return; }
                availableTracks = allTracksFromFile.filter(track => selectedCategoriesOnLoad.includes(track.category));
                if (availableTracks.length === 0) { showButtonError('No hi ha cançons en aquestes categories.'); return; }
                categoriesLocked = true;
                uploadSection.classList.add('hidden');
                hideDynamicContent(); 
                nouHitButton.disabled = true; 
                setTimeout(() => {
                    dynamicContentContainer.classList.remove('opacity-0', 'scale-95');
                    dynamicContentContainer.innerHTML = `<div class="text-center animate-pulse mt-4"><p class="text-xl font-bold text-green-400">Fes clic al Play (▶) per girar la ruleta!</p></div>`;
                    loadTrackAndPlayer();
                }, 300);
            } else {
                stopCountdown();
                setGlobalColor(DEFAULT_BODY_BG);
                if (availableTracks.length === 0) {
                    nouHitButton.disabled = true;
                    mostrarInfoButton.classList.add('hidden');
                    playerContainer.innerHTML = `<p class="text-white font-bold text-center p-4 text-xl">💿 Ja no queden cançons 🎸<br><span class="text-sm text-gray-400">(Reiniciant...)</span></p>`;
                    hideDynamicContent(); 
                    setTimeout(resetGame, 5000); 
                    return;
                }
                nouHitButton.disabled = true;
                hideDynamicContent(); 
                setTimeout(() => {
                    dynamicContentContainer.classList.remove('opacity-0', 'scale-95');
                    dynamicContentContainer.innerHTML = `<div class="text-center animate-pulse mt-4"><p class="text-xl font-bold text-green-400">Fes clic al Play (▶) per girar la ruleta!</p></div>`;
                    loadTrackAndPlayer();
                }, 300);
            }
        }
        
        function handleMostrarInfoClick() {
            stopCountdown(); 
            if (currentTrack && currentBingoResult) addToHistory(currentTrack, currentBingoResult, currentLevel);
            if (currentBingoResult) setGlobalColor(currentBingoResult.color);
            if (!currentTrack) { showButtonError("No hi ha cançó."); return; }
            
            const mask = document.getElementById('player-mask');
            if (mask) mask.remove();
            
            const player = document.getElementById('spotify-player-container');
            if (player) player.style.backgroundColor = DEFAULT_PLAYER_BG;
            
            dynamicContentContainer.classList.add('opacity-0', 'scale-95');
            categoryContainer.classList.add('opacity-0', 'scale-95');

            const currentCategory = currentTrack.category;
            const totalCount = allTracksFromFile.filter(t => t.category === currentCategory).length;
            const remainingCount = availableTracks.filter(track => track.category === currentCategory).length;
            const playedCount = totalCount - remainingCount;

            setTimeout(() => {
                dynamicContentContainer.innerHTML = '';
                categoryContainer.innerHTML = '';
                dynamicContentContainer.classList.remove('opacity-0', 'scale-95');
                categoryContainer.classList.remove('opacity-0', 'scale-95');
                
                const label = currentBingoResult ? currentBingoResult.label : '';
                const dimmedStyle = "text-sm font-bold text-gray-400 mt-1 mb-1";
                let titleClass = "", artistClass = "", yearClass = "";
                let extraInfoHTML = "";
                const trackYear = parseInt(currentTrack.year);
                
                if (!isNaN(trackYear)) {
                    if (label === "Anterior al 2000?") {
                        const isBefore = trackYear < 2000 ? "SÍ" : "NO";
                        extraInfoHTML = `<p class="text-4xl font-black ${currentBingoResult.textColorClass} mt-2">${isBefore}</p>`;
                    } else if (label === "Dècada") {
                        const decade = calculateDecadeText(trackYear);
                        extraInfoHTML = `<p class="text-xl font-black ${currentBingoResult.textColorClass} mt-1 uppercase">${decade}</p>`;
                    } else if (label.includes("anys amunt o avall")) {
                        const rangeText = calculateRangeText(trackYear, label);
                        extraInfoHTML = `<p class="text-xl font-bold ${currentBingoResult.textColorClass} mt-1">${rangeText}</p>`;
                    }
                }

                if (label === "Títol de la cançó") {
                    titleClass = "text-4xl font-extrabold text-green-400 leading-tight mb-2";
                    artistClass = dimmedStyle; yearClass = dimmedStyle;
                } else if (label === "Grup o solista" || label === "Nom del grup o solista") {
                    titleClass = dimmedStyle;
                    const artistColor = currentBingoResult ? currentBingoResult.textColorClass : 'text-white';
                    artistClass = `text-4xl font-extrabold ${artistColor} mt-1 mb-4 leading-tight`;
                    yearClass = dimmedStyle;
                } else {
                    titleClass = dimmedStyle; artistClass = dimmedStyle;
                    const yearColor = currentBingoResult ? currentBingoResult.textColorClass : 'text-green-400';
                    yearClass = `text-6xl font-extrabold ${yearColor} mb-2`;
                }
                
                let finalTitleHtml = currentTrack.title;
                if (currentTrack.extraInfo && currentTrack.extraInfo.trim() !== "") {
                     finalTitleHtml += `<br><span class="text-[0.7em] opacity-90">${currentTrack.extraInfo}</span>`; 
                }

                dynamicContentContainer.innerHTML = `
                    <div class="py-4">
                        <p class="${titleClass}">${finalTitleHtml}</p>
                        <p class="${artistClass}">${currentTrack.artist}</p>
                        <p class="${yearClass}">${currentTrack.year}</p>
                        ${currentBingoResult ? `
                        <div class="mt-6 flex flex-col items-center justify-center">
                            <div class="flex items-center justify-center space-x-2">
                                <span class="text-2xl">🎲</span>
                                <p class="text-xl font-bold ${currentBingoResult.textColorClass} uppercase tracking-wide text-center leading-tight">${currentBingoResult.label}</p>
                            </div>
                            ${extraInfoHTML}
                            ${currentLevel === 'expert' ? '<span class="text-xs text-gray-500 mt-2 uppercase tracking-widest">(Nivell Expert)</span>' : ''}
                        </div>` : ''}
                    </div>`;
                
                const catMeta = loadedFileMetadata.find(m => m.cleanName === currentCategory);
                const isPrio = catMeta ? catMeta.isPriority : false;
                categoryContainer.innerHTML = `<p class="text-xs text-gray-400 mb-2">Categoria: <span class="font-medium ${isPrio ? 'text-blue-400' : 'text-green-400'}">${currentCategory} (${playedCount} de ${totalCount})</span></p>`;
                
                mostrarInfoButton.classList.add('hidden');
                nouHitButton.classList.remove('hidden');
                nouHitButton.disabled = false;
            }, 300);
        }
        
        function toggleOrientationSimulation() {
            isSimulatedLandscape = !isSimulatedLandscape;
            if (isSimulatedLandscape) {
                mainCard.classList.add('landscape-mode');
                toggleOrientationBtn.textContent = '📐'; 
                toggleOrientationBtn.title = 'Tornar a Vertical';
            } else {
                mainCard.classList.remove('landscape-mode');
                toggleOrientationBtn.textContent = '🔄'; 
                toggleOrientationBtn.title = 'Passar a Horitzontal';
            }
        }

        async function initialize() {
            await fetchRemoteCsvs(); 
            renderSetupSection();
            nouHitButton.addEventListener('click', handleNouHitClick);
            mostrarInfoButton.addEventListener('click', handleMostrarInfoClick);
            uploadButton.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileUpload);
            toggleOrientationBtn.addEventListener('click', toggleOrientationSimulation);
            toggleOrientationBtn.title = 'Passar a Horitzontal'; 
            
            // Modal QR
            const qrModal = document.getElementById('qr-modal');
            const qrBtn = document.getElementById('qr-modal-btn');
            const closeQr = document.getElementById('close-qr-modal');

            if (qrBtn) {
                qrBtn.addEventListener('click', () => {
                    qrModal.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                });
            }
            if (closeQr) {
                closeQr.addEventListener('click', () => {
                    qrModal.classList.add('hidden', 'opacity-0', 'pointer-events-none');
                });
            }
            // Close modal on background click
            qrModal.addEventListener('click', (e) => {
                if (e.target === qrModal) {
                    qrModal.classList.add('hidden', 'opacity-0', 'pointer-events-none');
                }
            });

            toggleHistoryBtn.addEventListener('click', () => {
                historyListContainer.classList.toggle('hidden');
                if (historyListContainer.classList.contains('hidden')) historyArrow.style.transform = 'rotate(0deg)';
                else historyArrow.style.transform = 'rotate(180deg)';
            });
            document.addEventListener('keydown', (event) => {
                if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
                if (event.key.toLowerCase() === 'n') {
                    if (!nouHitButton.classList.contains('hidden') && !nouHitButton.disabled) nouHitButton.click();
                }
                if (event.key === 'Enter') {
                    if (!mostrarInfoButton.classList.contains('hidden') && !mostrarInfoButton.disabled) {
                        mostrarInfoButton.click();
                        event.preventDefault(); 
                    }
                }
            });
            if (window.innerWidth >= 1024) toggleOrientationSimulation();
        }

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
